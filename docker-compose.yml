services:
  filtarr:
    build:
      context: .
      dockerfile: Containerfile
      args:
        OCI_VERSION: ${FILTARR_VERSION:-0.1.0-dev}
        OCI_REVISION: ${GIT_COMMIT:-unknown}
        OCI_CREATED: ${BUILD_DATE:-unknown}
        OCI_SOURCE: https://github.com/wesleykirkland/Filtarr
        OCI_REF_NAME: ${GIT_BRANCH:-dev}
    container_name: filtarr
    restart: unless-stopped
    ports:
      - "${FILTARR_PORT:-9898}:9898"
    volumes:
      # Persistent data directory (SQLite database, logs, backups)
      - ./config:/config
      # Mount your media/download directories here
      # Example: Map your actual download path to /downloads in the container
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      # Add additional media paths as needed
      # - /path/to/movies:/movies:ro
      # - /path/to/tv:/tv:ro
    environment:
      # Server Configuration
      NODE_ENV: ${NODE_ENV:-production}
      FILTARR_PORT: 9898
      FILTARR_HOST: 0.0.0.0
      FILTARR_LOG_LEVEL: ${FILTARR_LOG_LEVEL:-info}
      FILTARR_DATA_DIR: /config
      FILTARR_VERSION: ${FILTARR_VERSION:-0.1.0-dev}

      # Encryption Secret (IMPORTANT: Set this to a secure random value)
      # Used for encrypting API keys in the database
      # Generate with: openssl rand -base64 32
      FILTARR_SECRET: ${FILTARR_SECRET:-}

      # Authentication mode (none, basic, forms, oidc) and admin credentials are
      # configured in the web UI setup wizard and stored in the database; they
      # are not read from environment variables.

      # Initial setup token. The setup wizard requires a one-time token; when unset,
      # Filtarr generates one on startup and prints it in the log ("Initial setup token").
      # Pre-set it here if you prefer (generate with: openssl rand -hex 32), and remove
      # it once setup is complete.
      # FILTARR_SETUP_TOKEN: ${FILTARR_SETUP_TOKEN:-}

      # Forms Auth (if using forms mode)
      # Session secret must be at least 32 characters
      # Generate with: openssl rand -base64 32
      # FILTARR_SESSION_SECRET: ${FILTARR_SESSION_SECRET:-}
      # FILTARR_SESSION_MAX_AGE: ${FILTARR_SESSION_MAX_AGE:-86400000}
      # FILTARR_SESSION_COOKIE_NAME: ${FILTARR_SESSION_COOKIE_NAME:-filtarr.sid}

      # Reverse proxy / cookie transport
      # FILTARR_TRUST_PROXY: trust X-Forwarded-* headers from a reverse proxy.
      #   false (default), a hop count (e.g. 1), or a comma list of proxy IPs/subnets
      #   (e.g. loopback,172.16.0.0/12). Prefer a hop count or CIDR list over `true`: with `true`
      #   the client IP is the spoofable leftmost X-Forwarded-For entry.
      #   Required behind a TLS-terminating proxy so forms login can set its Secure session cookie,
      #   and so rate limiting sees real client IPs (without it, all clients behind the proxy share
      #   one rate-limit bucket).
      # FILTARR_TRUST_PROXY: ${FILTARR_TRUST_PROXY:-false}
      # FILTARR_COOKIE_SECURE: Secure flag on the session cookie: true, false, or auto.
      #   Default: true when NODE_ENV=production. Set to false for plain-HTTP LAN access
      #   (otherwise forms login cannot persist a session), or auto to follow the request scheme.
      # FILTARR_COOKIE_SECURE: ${FILTARR_COOKIE_SECURE:-}

      # Host header allowlist (DNS-rebinding protection). Comma list of hostnames, optional :port,
      # case-insensitive. Other Host headers get 421. localhost, 127.0.0.1 and [::1] are always
      # allowed. Unset = accept any host (a warning is logged in production).
      # FILTARR_ALLOWED_HOSTS: ${FILTARR_ALLOWED_HOSTS:-filtarr.example.com,192.168.1.10:9898}

      # OIDC Auth (not yet available: no OIDC sign-in strategy ships in this build)
      # FILTARR_OIDC_ISSUER: ${FILTARR_OIDC_ISSUER:-}
      # FILTARR_OIDC_CLIENT_ID: ${FILTARR_OIDC_CLIENT_ID:-}
      # FILTARR_OIDC_CLIENT_SECRET: ${FILTARR_OIDC_CLIENT_SECRET:-}
      # FILTARR_OIDC_CALLBACK_URL: ${FILTARR_OIDC_CALLBACK_URL:-http://localhost:9898/api/v1/auth/oidc/callback}
      # FILTARR_OIDC_SCOPES: ${FILTARR_OIDC_SCOPES:-openid,profile,email}

      # CORS Configuration (optional)
      # FILTARR_CORS_ORIGIN: ${FILTARR_CORS_ORIGIN:-same-origin}

      # Security: Custom Scripts (DANGEROUS - opt-in only)
      # Enables JavaScript and shell script execution in filters
      # See docs/security-custom-scripts.md for security implications
      # FILTARR_ENABLE_CUSTOM_SCRIPTS: ${FILTARR_ENABLE_CUSTOM_SCRIPTS:-false}

    # User/Group ID mapping (optional - uncomment to match host user)
    # user: "1001:1001"

    # Network mode (optional - use host network for easier Arr instance discovery)
    # network_mode: host

networks:
  default:
    name: filtarr-network

