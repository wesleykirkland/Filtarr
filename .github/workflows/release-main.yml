name: Release main

on:
  workflow_run:
    workflows:
      - CI validation
    types:
      - completed
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: 24.22.1

jobs:
  release:
    name: Publish GitHub Release and GHCR image
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # semantic-release runs with a repo-write token only; image publishing lives in a
    # separate job so the npx-resolved release tooling never sees package or OIDC tokens.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release_version.outputs.published }}
      version: ${{ steps.release_version.outputs.version }}
      git_tag: ${{ steps.release_version.outputs.git_tag }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      release_ref_name: ${{ steps.context.outputs.release_ref_name }}
      image: ${{ steps.context.outputs.image }}
      created_at: ${{ steps.context.outputs.created_at }}
    steps:
      - name: Derive release context
        id: context
        shell: bash
        env:
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            release_sha="${WF_HEAD_SHA}"
            release_ref="refs/heads/${WF_HEAD_BRANCH}"
            release_ref_name="${WF_HEAD_BRANCH}"
          else
            release_sha="${GITHUB_SHA}"
            release_ref="${GITHUB_REF}"
            release_ref_name="${GITHUB_REF_NAME}"
          fi

          image_repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "release_sha=${release_sha}"
            echo "release_ref=${release_ref}"
            echo "release_ref_name=${release_ref_name}"
            echo "image=ghcr.io/${image_repository}"
            echo "created_at=${created_at}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Switch to the validated release commit
        # The commit comes from the CI run on a push to main (guarded by the job `if`).
        # Require it to be an ancestor of main before checking it out, so a stray
        # workflow_run from any other ref can never be released.
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
        run: |
          git fetch --force --tags origin
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          git checkout --detach "${RELEASE_SHA}"

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Capture existing tag on release commit
        id: previous_release
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
        run: |
          existing_tag="$(git tag --points-at "${RELEASE_SHA}" 'v*' | sort -V | tail -n1)"
          echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ steps.context.outputs.release_ref }}
          GITHUB_REF_NAME: ${{ steps.context.outputs.release_ref_name }}
          GITHUB_SHA: ${{ steps.context.outputs.release_sha }}
        # Exact version pin; this job holds only contents:write (see job comment).
        run: npx --yes semantic-release@25.0.3

      - name: Determine release outcome
        id: release_version
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
        run: |
          current_tag="$(git tag --points-at "${RELEASE_SHA}" 'v*' | sort -V | tail -n1)"

          if [ -z "${current_tag}" ] || [ "${current_tag}" = "${PREVIOUS_TAG}" ]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "git_tag=${current_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${current_tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Summarize release outcome
        if: always()
        shell: bash
        env:
          PUBLISHED: ${{ steps.release_version.outputs.published }}
          GIT_TAG: ${{ steps.release_version.outputs.git_tag }}
        run: |
          if [ "${PUBLISHED}" = "true" ]; then
            echo "### Release ${GIT_TAG} created; image publication runs in the next job." >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### No release published"
              echo
              echo "Semantic-release found no new stable version for this main-branch commit, so GHCR publication was skipped."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish-image:
    name: Publish GHCR image
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Switch to the released commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          git checkout --detach "${RELEASE_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ needs.release.outputs.image }}:${{ needs.release.outputs.version }}
            ${{ needs.release.outputs.image }}:latest
          build-args: |
            OCI_VERSION=${{ needs.release.outputs.version }}
            OCI_REVISION=${{ needs.release.outputs.release_sha }}
            OCI_CREATED=${{ needs.release.outputs.created_at }}
            OCI_REF_NAME=${{ needs.release.outputs.release_ref_name }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Attest pushed image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Summarize published image
        shell: bash
        env:
          GIT_TAG: ${{ needs.release.outputs.git_tag }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published release"
            echo
            echo "- Git tag: \`${GIT_TAG}\`"
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Image: \`${IMAGE}:latest\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
